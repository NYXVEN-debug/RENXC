<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Hub v4.0 | Ultimate Command Center</title>

    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        :root {
            --bg-style: linear-gradient(135deg, #0b0c10 0%, #1f2833 100%);
            --panel-bg: rgba(31, 40, 51, 0.85);
            --main-color: #66fcf1;
            --accent-color: #45a29e;
            --text-color: #c5c6c7;
        }

        body {
            background: var(--bg-style);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-bottom: 120px;
            overflow-x: hidden;
            transition: background 0.4s ease;
        }

        /* Navigasyon Sekmeleri */
        .nav-tabs {
            display: flex;
            gap: 8px;
            background: rgba(15, 15, 20, 0.8);
            padding: 8px;
            border-radius: 30px;
            border: 1px solid var(--main-color);
            backdrop-filter: blur(10px);
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            background: transparent;
            color: var(--text-color);
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: var(--main-color);
            color: #000;
            box-shadow: 0 0 15px var(--main-color);
        }

        /* Üst Sağ Ayarlar Barı */
        .settings-bar {
            position: fixed;
            top: 15px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .setting-btn {
            background: var(--panel-bg);
            color: var(--main-color);
            border: 1px solid var(--main-color);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            backdrop-filter: blur(5px);
        }

        .setting-btn:hover { background: var(--main-color); color: #000; }

        /* Tab İçerikleri */
        .tab-content {
            display: none;
            width: 100%;
            max-width: 500px;
            flex-direction: column;
            align-items: center;
        }
        .tab-content.active { display: flex; }

        /* ÇARK STİLLERİ */
        .category-selector { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .cat-btn {
            background: var(--panel-bg); color: var(--text-color); border: 1px solid var(--accent-color);
            padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold;
        }
        .cat-btn.active { background: var(--accent-color); color: #000; }

        .wheel-container { position: relative; width: 320px; height: 320px; margin-bottom: 20px; }
        .pointer {
            position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 12px solid transparent; border-right: 12px solid transparent;
            border-top: 25px solid var(--main-color); z-index: 10; filter: drop-shadow(0 0 8px var(--main-color));
        }
        canvas { width: 100%; height: 100%; border-radius: 50%; border: 4px solid var(--panel-bg); }

        .spin-btn {
            background: linear-gradient(45deg, var(--accent-color), var(--main-color));
            color: #000; border: none; padding: 12px 35px; font-size: 1.1rem; font-weight: 900;
            border-radius: 30px; cursor: pointer; box-shadow: 0 0 15px var(--main-color);
        }

        .custom-panel {
            margin-top: 20px; background: var(--panel-bg); padding: 15px; border-radius: 12px; width: 100%; border: 1px solid var(--accent-color);
        }
        .input-group { display: flex; gap: 8px; margin-bottom: 10px; }
        input[type="text"], input[type="number"] {
            padding: 8px; background: rgba(0,0,0,0.5); border: 1px solid var(--accent-color); color: #fff; border-radius: 6px; outline: none;
        }
        .tags-container { display: flex; flex-wrap: wrap; gap: 6px; max-height: 100px; overflow-y: auto; }
        .tag { background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; border: 1px solid var(--main-color); }
        .tag span { color: #ff4d4d; cursor: pointer; margin-left: 5px; }

        /* ZAMANLAYICI & TO-DO */
        .timer-display { font-size: 3.5rem; font-weight: 900; color: var(--main-color); text-shadow: 0 0 20px var(--main-color); margin: 15px 0; font-family: monospace; }
        .timer-inputs { display: flex; gap: 10px; margin-bottom: 15px; }
        .timer-inputs input { width: 70px; text-align: center; font-size: 1.2rem; }
        .control-btns { display: flex; gap: 10px; margin-bottom: 20px; }
        .action-btn { background: var(--accent-color); color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 8px; cursor: pointer; }

        /* To-Do List Stili */
        .todo-box { width: 100%; background: var(--panel-bg); border: 1px solid var(--accent-color); border-radius: 12px; padding: 15px; }
        .todo-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: rgba(0,0,0,0.4); border-radius: 6px; margin-bottom: 6px; }
        .todo-text { cursor: pointer; flex: 1; }
        .todo-text.done { text-decoration: line-through; opacity: 0.5; }
        .delete-btn { color: #ff4d4d; cursor: pointer; font-size: 1.1rem; padding: 2px 6px; }

        /* MÜZİK PLAYER (SABİT ALT BAR) */
        .music-player {
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 520px;
            background: var(--panel-bg); border: 1px solid var(--main-color); border-radius: 20px; padding: 10px 15px;
            display: flex; align-items: center; gap: 10px; backdrop-filter: blur(10px); box-shadow: 0 0 20px rgba(0,0,0,0.8); z-index: 99;
        }

        /* MINI GAME - SNAKE */
        #snakeCanvas { background: #000; border: 2px solid var(--main-color); border-radius: 8px; }

        /* MODALLAR */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85);
            display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; z-index: 1000;
        }
        .modal.active { opacity: 1; pointer-events: all; }
        .modal-content {
            background: var(--panel-bg); border: 3px solid var(--main-color); padding: 40px; border-radius: 20px;
            text-align: center; box-shadow: 0 0 50px var(--main-color); transform: scale(0.5); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal.active .modal-content { transform: scale(1); }

        .settings-modal {
            display: none; position: fixed; top: 60px; right: 20px; background: var(--panel-bg);
            border: 1px solid var(--main-color); padding: 20px; border-radius: 12px; z-index: 200; width: 300px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            max-height: 80vh; overflow-y: auto;
        }
        .settings-modal h4 { margin-bottom: 8px; color: var(--main-color); border-bottom: 1px solid var(--accent-color); padding-bottom: 4px; }
        .setting-row { margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; }
        .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- Üst Sağ Ayarlar -->
    <div class="settings-bar">
        <button class="setting-btn" onclick="togglePanel('themePanel')">🎨 Temalar</button>
        <button class="setting-btn" onclick="togglePanel('audioPanel')">🔔 Bitiş Sesi</button>
    </div>

    <!-- TEMA SEÇİM & AYAR PANELİ -->
    <div id="themePanel" class="settings-modal">
        <h4>🎨 Düz Renk Temalar</h4>
        <div class="preset-grid">
            <button class="setting-btn" onclick="setPresetStyle('solid', '#000000')">⬛ Simsiyah</button>
            <button class="setting-btn" onclick="setPresetStyle('solid', '#0a192f')">🟦 Lacivert</button>
            <button class="setting-btn" onclick="setPresetStyle('solid', '#120024')">🟪 Koyu Mor</button>
            <button class="setting-btn" onclick="setPresetStyle('solid', '#0d1f12')">🟩 Askeri Yeşil</button>
        </div>

        <h4>🎨 Geçişli (Gradient) Temalar</h4>
        <div class="preset-grid">
            <button class="setting-btn" onclick="setPresetStyle('gradient', '#0b0c10', '#1f2833')">🤖 Cyberpunk</button>
            <button class="setting-btn" onclick="setPresetStyle('gradient', '#000500', '#003300')">🟢 Matrix</button>
            <button class="setting-btn" onclick="setPresetStyle('gradient', '#120012', '#400040')">🟣 Neon Pink</button>
            <button class="setting-btn" onclick="setPresetStyle('gradient', '#0d0000', '#4a0000')">🔴 Red Alert</button>
        </div>

        <h4>⚙️ Kendin Ayarla</h4>
        <div class="setting-row">
            <label>Tema Tipi:</label>
            <select id="themeType" onchange="updateThemeStyle()" style="padding: 5px; background: #000; color: #fff;">
                <option value="gradient">Geçişli (Gradient)</option>
                <option value="solid">Düz Renk</option>
            </select>
        </div>
        <div class="setting-row">
            <label>Renk 1 (Üst / Düz):</label>
            <input type="color" id="color1" value="#0b0c10" onchange="updateThemeStyle()">
        </div>
        <div class="setting-row" id="color2Row">
            <label>Renk 2 (Alt):</label>
            <input type="color" id="color2" value="#1f2833" onchange="updateThemeStyle()">
        </div>
    </div>

    <!-- ZAMANLAYICI BİTİŞ SESİ PANELİ -->
    <div id="audioPanel" class="settings-modal">
        <h4>🔔 Bitiş Uyarısı Sesi</h4>
        <div class="setting-row">
            <label>PC'den Ses Seç (MP3/WAV):</label>
            <input type="file" id="alertAudioInput" accept="audio/*" onchange="saveAlertAudio(event)">
        </div>
        <div id="alertAudioStatus" style="font-size: 0.75rem; color: var(--main-color);">Kayıtlı Özel Bitiş Sesi Yok</div>
    </div>

    <!-- SEKME BUTONLARI -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('wheelTab', this)">🎲 Karar Çarkı</button>
        <button class="tab-btn" onclick="switchTab('timerTab', this)">⏱️ Zamanlayıcı & To-Do</button>
        <button class="tab-btn" onclick="switchTab('stopwatchTab', this)">⏱️ Kronometre</button>
        <button class="tab-btn" onclick="switchTab('gameTab', this)">🎮 Mini Oyun</button>
    </div>

    <!-- 1. TAB: ÇARK -->
    <div id="wheelTab" class="tab-content active">
        <div class="category-selector">
            <button class="cat-btn active" onclick="setCategory('games')">🎮 Oyunlar</button>
            <button class="cat-btn" onclick="setCategory('movies')">🎬 Filmler</button>
            <button class="cat-btn" onclick="setCategory('yt')">📺 YouTube</button>
        </div>
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="350" height="350"></canvas>
        </div>
        <button class="spin-btn" id="spinBtn" onclick="spinWheel()">KADERİNİ ÇEVİR!</button>

        <div class="custom-panel">
            <div class="input-group">
                <input type="text" id="newItemInput" placeholder="Yeni seçenek ekle..." style="flex:1;">
                <button onclick="addItem()" style="padding:8px; background:var(--main-color); border:none; border-radius:6px; cursor:pointer; font-weight:bold;">Ekle</button>
            </div>
            <div class="tags-container" id="tagsContainer"></div>
        </div>
    </div>

    <!-- 2. TAB: ZAMANLAYICI & TO-DO -->
    <div id="timerTab" class="tab-content">
        <div class="timer-display" id="timerDisplay">00:05:00</div>
        <div class="timer-inputs">
            <input type="number" id="timerH" placeholder="Saat" value="0">
            <input type="number" id="timerM" placeholder="Dakika" value="5">
            <input type="number" id="timerS" placeholder="Saniye" value="0">
        </div>
        <div class="control-btns">
            <button class="action-btn" onclick="startTimer()">Başlat</button>
            <button class="action-btn" onclick="pauseTimer()" style="background:#ffbd59;">Durdur</button>
            <button class="action-btn" onclick="resetTimer()" style="background:#ff5757;">Sıfırla</button>
        </div>

        <div class="todo-box">
            <h4 style="color:var(--main-color); margin-bottom:10px;">🎯 Günün Hedefleri</h4>
            <div class="input-group">
                <input type="text" id="todoInput" placeholder="Görev ekle..." style="flex:1;">
                <button onclick="addTodo()" style="padding:8px; background:var(--accent-color); border:none; border-radius:6px; cursor:pointer; font-weight:bold;">Ekle</button>
            </div>
            <div id="todoList"></div>
        </div>
    </div>

    <!-- 3. TAB: KRONOMETRE -->
    <div id="stopwatchTab" class="tab-content">
        <div class="timer-display" id="swDisplay">00:00:00.0</div>
        <div class="control-btns">
            <button class="action-btn" onclick="startSW()">Başlat</button>
            <button class="action-btn" onclick="pauseSW()" style="background:#ffbd59;">Durdur</button>
            <button class="action-btn" onclick="resetSW()" style="background:#ff5757;">Sıfırla</button>
        </div>
    </div>

    <!-- 4. TAB: MINI OYUN (SNAKE) -->
    <div id="gameTab" class="tab-content">
        <div style="font-weight:bold; color:var(--main-color); margin-bottom:10px;">🐍 Retro Yılan Oyunu (Skor: <span id="snakeScore">0</span>)</div>
        <canvas id="snakeCanvas" width="300" height="300"></canvas>
        <div class="control-btns" style="margin-top:10px;">
            <button class="action-btn" onclick="startSnake()">Başlat / Sıfırla</button>
        </div>
    </div>

    <!-- ARKA PLAN MÜZİK PLAYER (PC MP3/WAV - KALICI) -->
    <div class="music-player">
        <button class="setting-btn" id="bgMusicToggleBtn" onclick="toggleBgMusic()">▶️ Başlat</button>
        
        <label class="setting-btn" style="cursor:pointer; margin:0;">
            📁 Şarkı Seç
            <input type="file" id="bgMusicFileInput" accept="audio/*" onchange="saveBgMusic(event)" style="display:none;">
        </label>

        <span id="bgMusicName" style="font-size:0.75rem; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--main-color);">Şarkı Yüklenmedi</span>

        <input type="range" id="bgVolumeSlider" min="0" max="1" step="0.05" value="0.5" onchange="setBgVolume(this.value)" style="width:70px;">
    </div>

    <!-- KAZANAN MODAL POPUP -->
    <div class="modal" id="winnerModal">
        <div class="modal-content">
            <div style="font-size: 1.2rem; color: #aaa; margin-bottom: 10px;">🎯 KAZANAN SEÇİLDİ!</div>
            <div id="modalWinnerName" style="font-size: 2.5rem; color: var(--main-color); font-weight: 900; text-shadow: 0 0 20px var(--main-color);">VALORANT</div>
        </div>
    </div>

    <script>
        // --- BİTİŞ SESİ & SES SİSTEMİ (LOCALSTORAGE KALICI) ---
        let alertAudio = new Audio();
        let bgAudio = new Audio();
        bgAudio.loop = true;

        window.addEventListener('load', () => {
            // Kayıtlı Bitiş Sesini Yükle
            const savedAlert = localStorage.getItem('user_alert_audio');
            if (savedAlert) {
                alertAudio.src = savedAlert;
                document.getElementById('alertAudioStatus').innerText = "Kayıtlı Özel Bitiş Sesi Aktif! ✅";
            }

            // Kayıtlı Arka Plan Müziğini Yükle
            const savedBg = localStorage.getItem('user_bg_music');
            const savedBgName = localStorage.getItem('user_bg_music_name');
            if (savedBg) {
                bgAudio.src = savedBg;
                document.getElementById('bgMusicName').innerText = savedBgName || "Kayıtlı Şarkı";
            }

            // Kayıtlı Temayı Yükle
            const savedThemeType = localStorage.getItem('user_theme_type');
            const savedC1 = localStorage.getItem('user_theme_c1');
            const savedC2 = localStorage.getItem('user_theme_c2');
            if(savedThemeType) {
                document.getElementById('themeType').value = savedThemeType;
                document.getElementById('color1').value = savedC1 || '#0b0c10';
                document.getElementById('color2').value = savedC2 || '#1f2833';
                updateThemeStyle(false);
            }

            loadTodoList();
        });

        // Bitiş Sesini Kaydet
        function saveAlertAudio(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const base64 = evt.target.result;
                    localStorage.setItem('user_alert_audio', base64);
                    alertAudio.src = base64;
                    document.getElementById('alertAudioStatus').innerText = "Özel Bitiş Sesi Kaydedildi! ✅";
                };
                reader.readAsDataURL(file);
            }
        }

        // Zamanlayıcı Bitince Çal
        function playTimerEndSound() {
            if (alertAudio.src) {
                alertAudio.currentTime = 0;
                alertAudio.play();
            } else {
                // Varsayılan Bip
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 1.5);
            }
        }

        // --- ARKA PLAN MÜZİĞİ (PC'DEN & KALICI) ---
        function saveBgMusic(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const base64 = evt.target.result;
                    localStorage.setItem('user_bg_music', base64);
                    localStorage.setItem('user_bg_music_name', file.name);
                    bgAudio.src = base64;
                    document.getElementById('bgMusicName').innerText = file.name;
                    toggleBgMusic(true); // Otomatik başlat
                };
                reader.readAsDataURL(file);
            }
        }

        function toggleBgMusic(forcePlay = false) {
            const btn = document.getElementById('bgMusicToggleBtn');
            if (!bgAudio.src) { alert("Lütfen önce '📁 Şarkı Seç' butonundan bilgisayarından bir MP3 seç kanka!"); return; }

            if (bgAudio.paused || forcePlay) {
                bgAudio.play();
                btn.innerText = "⏸️ Durdur";
            } else {
                bgAudio.pause();
                btn.innerText = "▶️ Başlat";
            }
        }

        function setBgVolume(val) { bgAudio.volume = val; }

        // --- TEMA MANTIĞI (ÖZEL AYARLAR + DÜZ/GEÇİŞLİ ŞABLONLAR) ---
        function updateThemeStyle(save = true) {
            const type = document.getElementById('themeType').value;
            const c1 = document.getElementById('color1').value;
            const c2 = document.getElementById('color2').value;

            if (type === 'gradient') {
                document.body.style.background = `linear-gradient(135deg, ${c1} 0%, ${c2} 100%)`;
                document.getElementById('color2Row').style.display = 'flex';
            } else {
                document.body.style.background = c1;
                document.getElementById('color2Row').style.display = 'none';
            }

            if(save) {
                localStorage.setItem('user_theme_type', type);
                localStorage.setItem('user_theme_c1', c1);
                localStorage.setItem('user_theme_c2', c2);
            }
        }

        function setPresetStyle(type, c1, c2 = '#000000') {
            document.getElementById('themeType').value = type;
            document.getElementById('color1').value = c1;
            document.getElementById('color2').value = c2;
            updateThemeStyle(true);
        }

        // --- WEBAUDIO (ÇARK TIK-TIK SESİ) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.04);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.04);
        }

        // --- KALICI TO-DO LIST ---
        let todos = JSON.parse(localStorage.getItem('user_todos')) || [];
        function saveAndRenderTodos() {
            localStorage.setItem('user_todos', JSON.stringify(todos));
            const container = document.getElementById('todoList');
            container.innerHTML = '';
            todos.forEach((todo, index) => {
                const item = document.createElement('div');
                item.className = 'todo-item';
                item.innerHTML = `
                    <span class="todo-text ${todo.done ? 'done' : ''}" onclick="toggleTodo(${index})">${todo.text}</span>
                    <span class="delete-btn" onclick="deleteTodo(${index})">🗑️</span>
                `;
                container.appendChild(item);
            });
        }
        function addTodo() {
            const input = document.getElementById('todoInput');
            if (input.value.trim()) { todos.push({ text: input.value.trim(), done: false }); input.value = ''; saveAndRenderTodos(); }
        }
        function toggleTodo(i) { todos[i].done = !todos[i].done; saveAndRenderTodos(); }
        function deleteTodo(i) { todos.splice(i, 1); saveAndRenderTodos(); }
        function loadTodoList() { saveAndRenderTodos(); }

        // --- ÇARK MANTIĞI ---
        const presets = {
            games: ['Valorant', 'Minecraft', 'Roblox', 'GTA V', 'CS2', 'Rocket League'],
            movies: ['Interstellar', 'Fight Club', 'Matrix', 'Inception'],
            yt: ['Gameplay', 'Yazılım', 'Belgesel', 'Komedi', 'Podcast']
        };
        let currentList = [...presets.games];
        let startAngle = 0; let isSpinning = false; let spinVelocity = 0; let lastSegmentIndex = -1;
        const canvas = document.getElementById('wheelCanvas'); const ctx = canvas.getContext('2d');

        function setCategory(cat) { if (isSpinning) return; currentList = [...presets[cat]]; renderTags(); drawWheel(); }

        function drawWheel() {
            const num = currentList.length; if (num === 0) return;
            const arc = (2 * Math.PI) / num;
            ctx.clearRect(0,0,350,350);
            const mainColor = getComputedStyle(document.documentElement).getPropertyValue('--main-color').trim();
            const colors = ['#1f2833', mainColor, '#0b0c10', '#254e58'];

            for (let i = 0; i < num; i++) {
                const angle = startAngle + i * arc;
                ctx.fillStyle = colors[i % colors.length];
                ctx.beginPath(); ctx.arc(175, 175, 160, angle, angle + arc, false); ctx.arc(175, 175, 0, angle + arc, angle, true); ctx.fill(); ctx.stroke();
                ctx.save();
                ctx.fillStyle = (colors[i % colors.length] === mainColor) ? '#000' : '#fff';
                ctx.translate(175 + Math.cos(angle + arc / 2) * 100, 175 + Math.sin(angle + arc / 2) * 100);
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                ctx.font = 'bold 12px Segoe UI';
                ctx.fillText(currentList[i], -ctx.measureText(currentList[i]).width / 2, 0);
                ctx.restore();
            }
        }

        function spinWheel() {
            if (isSpinning || currentList.length === 0) return;
            isSpinning = true; spinVelocity = Math.random() * 0.2 + 0.3;
            function animate() {
                if (spinVelocity > 0.001) {
                    startAngle += spinVelocity; spinVelocity *= 0.985; drawWheel();
                    const num = currentList.length;
                    let degrees = (startAngle * 180 / Math.PI) % 360;
                    const currentSegment = Math.floor((360 - degrees + 270) % 360 / (360 / num));
                    if (currentSegment !== lastSegmentIndex) { playTickSound(); lastSegmentIndex = currentSegment; }
                    requestAnimationFrame(animate);
                } else { isSpinning = false; showWinner(); }
            }
            animate();
        }

        function showWinner() {
            const num = currentList.length;
            let degrees = (startAngle * 180 / Math.PI) % 360; if (degrees < 0) degrees += 360;
            const index = Math.floor((360 - degrees + 270) % 360 / (360 / num));
            const winner = currentList[index];
            const modal = document.getElementById('winnerModal');
            document.getElementById('modalWinnerName').innerText = winner.toUpperCase();
            modal.classList.add('active');
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            setTimeout(() => { modal.classList.remove('active'); }, 3500);
        }

        function renderTags() {
            const c = document.getElementById('tagsContainer'); c.innerHTML = '';
            currentList.forEach((item, i) => { c.innerHTML += `<div class="tag">${item} <span onclick="removeItem(${i})">✕</span></div>`; });
        }
        function addItem() { const input = document.getElementById('newItemInput'); if (input.value.trim()) { currentList.push(input.value.trim()); input.value = ''; renderTags(); drawWheel(); } }
        function removeItem(i) { currentList.splice(i, 1); renderTags(); drawWheel(); }

        // --- ZAMANLAYICI & KRONOMETRE ---
        let timerInterval = null, totalSeconds = 0;
        function startTimer() {
            if (timerInterval) return;
            const h = parseInt(document.getElementById('timerH').value) || 0;
            const m = parseInt(document.getElementById('timerM').value) || 0;
            const s = parseInt(document.getElementById('timerS').value) || 0;
            if (totalSeconds === 0) totalSeconds = h * 3600 + m * 60 + s;
            timerInterval = setInterval(() => {
                if (totalSeconds > 0) { totalSeconds--; updateTimerDisplay(); }
                else { clearInterval(timerInterval); timerInterval = null; playTimerEndSound(); }
            }, 1000);
        }
        function pauseTimer() { clearInterval(timerInterval); timerInterval = null; }
        function resetTimer() { pauseTimer(); totalSeconds = 0; updateTimerDisplay(); }
        function updateTimerDisplay() {
            const hrs = Math.floor(totalSeconds / 3600), mins = Math.floor((totalSeconds % 3600) / 60), secs = totalSeconds % 60;
            document.getElementById('timerDisplay').innerText = `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
        }

        let swInterval = null, swMs = 0;
        function startSW() {
            if (swInterval) return;
            swInterval = setInterval(() => {
                swMs += 100;
                const totalSec = Math.floor(swMs / 1000), hrs = Math.floor(totalSec / 3600), mins = Math.floor((totalSec % 3600) / 60), secs = totalSec % 60, ms = (swMs % 1000) / 100;
                document.getElementById('swDisplay').innerText = `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}.${ms}`;
            }, 100);
        }
        function pauseSW() { clearInterval(swInterval); swInterval = null; }
        function resetSW() { pauseSW(); swMs = 0; document.getElementById('swDisplay').innerText = "00:00:00.0"; }

        // --- SNAKE OYUNU ---
        const sCanvas = document.getElementById('snakeCanvas'); const sCtx = sCanvas.getContext('2d');
        let snake = [{x: 10, y: 10}], food = {x: 15, y: 15}, dx = 1, dy = 0, score = 0, snakeInterval = null;
        function startSnake() {
            snake = [{x: 10, y: 10}]; food = {x: Math.floor(Math.random()*15), y: Math.floor(Math.random()*15)};
            dx = 1; dy = 0; score = 0; document.getElementById('snakeScore').innerText = score;
            if(snakeInterval) clearInterval(snakeInterval); snakeInterval = setInterval(updateSnake, 120);
        }
        function updateSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            if (head.x < 0 || head.x >= 15 || head.y < 0 || head.y >= 15) { clearInterval(snakeInterval); alert("Game Over! Skor: " + score); return; }
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10; document.getElementById('snakeScore').innerText = score;
                food = {x: Math.floor(Math.random()*15), y: Math.floor(Math.random()*15)};
            } else { snake.pop(); }
            sCtx.fillStyle = '#000'; sCtx.fillRect(0,0,300,300);
            sCtx.fillStyle = '#ff4d4d'; sCtx.fillRect(food.x*20, food.y*20, 18, 18);
            sCtx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--main-color').trim();
            snake.forEach(part => sCtx.fillRect(part.x*20, part.y*20, 18, 18));
        }
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -1; } if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 1; }
            if (e.key === 'ArrowLeft' && dx === 0) { dx = -1; dy = 0; } if (e.key === 'ArrowRight' && dx === 0) { dx = 1; dy = 0; }
        });

        // Genel Yardımcılar
        function togglePanel(id) { const p = document.getElementById(id); p.style.display = p.style.display === 'block' ? 'none' : 'block'; }
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active'); btn.classList.add('active');
        }

        renderTags(); drawWheel();
    </script>
</body>
</html>
